<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haikatalyst — Education Mini Games</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background: #D2D2E6;
    }

    /* ==============================
       MINIMAL BACKDROP (matches robot #D2D2E6)
       ============================== */
    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #D2D2E6;
    }

    /* ==============================
       ABOUT LINK (standalone)
       ============================== */
    .about-link {
      position: fixed;
      top: 20px;
      right: clamp(20px, 4vw, 40px);
      z-index: 100;
      font-size: 15px;
      font-weight: 700;
      color: oklch(0.40 0.02 260);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }

    .about-link:hover {
      background: oklch(0.000 0.000 0 / 0.06);
    }

    /* ==============================
       HERO
       ============================== */
    .hero {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .hero-header {
      text-align: center;
      max-width: 720px;
      margin-bottom: clamp(32px, 6vh, 64px);
      animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .hero-headline {
      font-family: 'Baloo 2', cursive;
      font-size: clamp(40px, 6vw, 76px);
      line-height: 1.05;
      font-weight: 900;
      color: oklch(0.18 0.02 260);
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .hero-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(24px, 4vw, 64px);
      width: 100%;
      margin: auto 0;
    }

    .hero-robot-col {
      flex: 1.4;
      display: flex;
      justify-content: center;
      animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .robot-card {
      position: relative;
      width: 100%;
      max-width: 680px;
      aspect-ratio: 1 / 1;
      background: transparent;
      border: none;
      box-shadow: none;
      overflow: hidden;
    }

    .robot-card spline-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Menutupi badge "Built with Spline" dengan warna background */
    .spline-cover {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 200px;
      height: 56px;
      background: #D2D2E6;
      pointer-events: none;
      z-index: 5;
    }

    spline-viewer::part(logo) {
      display: none !important;
    }

    .hero-play-col {
      flex: 0.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .play-desc {
      max-width: 340px;
      text-align: justify;
      text-wrap: pretty;
      color: oklch(0.40 0.02 260);
      line-height: 1.6;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 700;
    }

    .cta-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      background: linear-gradient(135deg, oklch(0.80 0.11 240), oklch(0.62 0.15 245));
      color: oklch(1.000 0.000 0);
      font-family: 'Baloo 2', cursive;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 900;
      padding: 16px 48px;
      border-radius: 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: transform 0.2s;
      box-shadow: 0 6px 0 oklch(0.48 0.14 245), 0 8px 22px oklch(0.62 0.15 245 / 0.35);
      animation: ctaGlow 2.6s ease-in-out infinite;
    }

    .cta-btn .cta-label {
      position: relative;
      z-index: 1;
    }

    .cta-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, oklch(1.000 0.000 0 / 0.35), transparent);
      transform: skewX(-20deg);
      animation: ctaShine 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ctaGlow {
      0%, 100% { box-shadow: 0 6px 0 oklch(0.48 0.14 245), 0 8px 22px oklch(0.62 0.15 245 / 0.30); }
      50% { box-shadow: 0 6px 0 oklch(0.48 0.14 245), 0 14px 40px oklch(0.62 0.15 245 / 0.60); }
    }

    @keyframes ctaShine {
      0% { left: -60%; }
      55%, 100% { left: 130%; }
    }

    .cta-btn:hover {
      transform: translateY(-4px) scale(1.03);
    }

    .cta-btn:active {
      transform: translateY(3px) scale(0.98);
      transition-duration: 0.05s;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ==============================
       RESPONSIVE
       ============================== */
    @media (max-width: 860px) {
      .hero {
        padding-top: 100px;
      }

      .hero-content {
        flex-direction: column;
        gap: 32px;
      }

      .hero-robot-col,
      .hero-play-col {
        flex: none;
        width: 100%;
      }

      .robot-card {
        max-width: 360px;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding: 90px 20px 40px;
      }

      .cta-btn {
        width: 100%;
        padding: 14px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-gradient {
        animation: none;
      }

      .hero-header,
      .hero-robot-col,
      .hero-play-col {
        animation: none;
        opacity: 1;
      }

      .cta-btn {
        transition: none;
        animation: none;
      }

      .cta-btn::after {
        animation: none;
      }

      .cta-btn:hover {
        transform: none;
      }
    }
  </style>
  <script type="module" src="https://unpkg.com/@splinetool/viewer/build/spline-viewer.js"></script>
</head>

<body>
  <!-- Minimal backdrop -->
  <div class="bg-gradient" aria-hidden="true"></div>

  <!-- About link -->
  <a class="about-link interact-btn" href="developer.html">Tentang Pembuat</a>

  <!-- Hero -->
  <main class="hero">
    <header class="hero-header">
      <h1 class="hero-headline">Haikatalyst</h1>
    </header>

    <div class="hero-content">
      <div class="hero-robot-col">
        <div class="robot-card">
          <spline-viewer url="https://prod.spline.design/DMpY0Y0s7JftE1LU/scene.splinecode"></spline-viewer>
          <div class="spline-cover" aria-hidden="true"></div>
        </div>
      </div>

      <div class="hero-play-col">
        <p class="play-desc">
          Yuk, hidupkan suasana belajar dengan cara yang lebih seru! Jelajahi ratusan mini game interaktif yang mengubah setiap materi menjadi pengalaman belajar yang menyenangkan, lebih interaktif, dan lebih mudah dipahami.
        </p>
        <button class="cta-btn interact-btn" data-href="jenjang.html">
          <span class="cta-label">AYO MAIN</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.querySelector('.cta-btn');
      const aboutLink = document.querySelector('.about-link');

      const handleAboutClick = (e) => {
        const href = e.currentTarget.getAttribute('href');
        if (window.SFX) window.SFX.click();
        e.preventDefault();
        setTimeout(() => { window.location.href = href; }, 300);
      };

      const handleCtaClick = (e) => {
        const href = e.currentTarget.getAttribute('data-href');
        if (window.SFX) window.SFX.click();
        setTimeout(() => { window.location.href = href; }, 300);
      };

      if (btn) {
        btn.addEventListener('click', handleCtaClick);
        btn.addEventListener('mouseenter', () => { if (window.SFX) window.SFX.hover(); });
      }

      if (aboutLink) {
        aboutLink.addEventListener('click', handleAboutClick);
        aboutLink.addEventListener('mouseenter', () => { if (window.SFX) window.SFX.hover(); });
      }
    });
  </script>
  <script src="js/sfx.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let audioStarted = false;
      const startAudio = () => {
        if (!audioStarted && window.SFX) {
          window.SFX.bgmStart();
          audioStarted = true;
          document.removeEventListener("pointerdown", startAudio);
        }
      };
      document.addEventListener("pointerdown", startAudio);
    });
  </script>
</body>

</html>
