<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Kelas Kamu - Haikatalyst</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800;900&family=Nunito:wght@500;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/jenjang.css">
  <link rel="stylesheet" href="css/pixel-art-icons.css">
  <script src="js/pixel-art-icons.js"></script>
</head>

<body>
  <!-- Epic Background Elements -->
  <div class="grid-overlay"></div>
  <div id="epic-bg" class="epic-bg"></div>

  <main class="page">
    <section class="hero-box reveal">
      <h1>Pilih Kelas Kamu</h1>
      <p>
        Yuk, pilih kelas kamu dulu! Setelah itu, tinggal pilih materi yang mau dimainkan.
      </p>
    </section>

    <section class="card-strip" aria-label="Pilihan jenjang kelas">
      <button class="class-btn reveal" style="--delay: 0ms" data-grade="1">
        <span class="class-btn-inner">
          <span class="class-label">KELAS</span>
          <span class="class-number">1</span>
        </span>
      </button>
      <button class="class-btn reveal" style="--delay: 100ms" data-grade="2">
        <span class="class-btn-inner">
          <span class="class-label">KELAS</span>
          <span class="class-number">2</span>
        </span>
      </button>
      <button class="class-btn reveal" style="--delay: 200ms" data-grade="3">
        <span class="class-btn-inner">
          <span class="class-label">KELAS</span>
          <span class="class-number">3</span>
        </span>
      </button>
      <button class="class-btn reveal" style="--delay: 300ms" data-grade="4">
        <span class="class-btn-inner">
          <span class="class-label">KELAS</span>
          <span class="class-number">4</span>
        </span>
      </button>
      <button class="class-btn reveal" style="--delay: 400ms" data-grade="5">
        <span class="class-btn-inner">
          <span class="class-label">KELAS</span>
          <span class="class-number">5</span>
        </span>
      </button>
      <button class="class-btn reveal" style="--delay: 500ms" data-grade="6">
        <span class="class-btn-inner">
          <span class="class-label">KELAS</span>
          <span class="class-number">6</span>
        </span>
      </button>
    </section>

    <div class="footer-row reveal" style="--delay: 600ms">
      <p class="hint"></p>
      <a class="back-link" href="index.html">← Kembali ke Beranda</a>
    </div>
  </main>

  <div class="overlay" id="materialOverlay">
    <div class="modal">
      <h2 id="modalTitle">Pilih Materi</h2>
      <p id="modalDescription">Pilih materi yang ingin kamu mainkan, yuk!</p>

      <select id="materialSelect"></select>
      <div class="status" id="materialStatus"></div>

      <div class="modal-actions">
        <button id="startMaterialBtn" type="button">Mulai Main!</button>
        <button id="closeModalBtn" type="button">Tutup</button>
      </div>
    </div>
  </div>

  <script src="js/sfx.js"></script>
  <script src="js/jenjang.js"></script>
  <script>
    // Epic Particles Generator
    document.addEventListener('DOMContentLoaded', () => {
      const bg = document.getElementById('epic-bg');
      const particleCount = window.innerWidth < 768 ? 20 : 40;

      for (let i = 0; i < particleCount; i++) {
        let p = document.createElement('div');
        p.className = 'epic-particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 10 + 5) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's';
        p.style.opacity = Math.random() * 0.7 + 0.3;
        let size = Math.random() * 6 + 2;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        bg.appendChild(p);
      }
    });
  </script>
</body>

</html>
