<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelas 1 - Bahasa Indonesia - Menyusun Kalimat</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/game-kelas1.css">
  <link rel="stylesheet" href="css/pixel-art-icons.css">
  <script src="js/pixel-art-icons.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header Card -->
    <header class="card title">
      <h1>Ayo Menyusun Kalimat!</h1>
      <p>Susun kata-kata di bawah ini jadi kalimat yang benar, yuk!</p>
    </header>

    <!-- Stats Bar -->
    <section class="stats" aria-label="Statistik Permainan">
      <div class="stat">
        <small>Soal ke-</small>
        <strong>🎯 <span id="levelText">1</span>/5</strong>
      </div>
      <div class="stat">
        <small>Skor Kamu</small>
        <strong>💰 <span id="scoreText">0</span></strong>
      </div>
      <div class="stat">
        <small>Kesempatan</small>
        <strong>⚡ <span id="livesText">3</span></strong>
      </div>
    </section>

    <!-- Game Work Area -->
    <main class="card game-card">
      <div id="sentenceTarget">Kalimat 1</div>
      <p id="hintText" class="hint">Hint: Aktivitas yang dilakukan di rumah atau sekolah.</p>
      
      <!-- Drop Zone Area -->
      <div id="dropZone" class="drop-zone empty"></div>
      
      <!-- Word Pool (Bank) Area -->
      <div id="wordBank" class="word-bank"></div>
      
      <!-- Feedback Message -->
      <div id="feedback"></div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="checkBtn" class="btn primary" type="button">Cek Jawaban</button>
        <button id="resetBtn" class="btn secondary" type="button">Ulang Lagi</button>
        <button id="skipBtn" class="btn warn" type="button">Lewati Soal</button>
      </div>
    </main>

    <!-- Footer Area -->
    <footer class="row">
      <p class="hint">Tips: Seret atau klik kata-kata untuk menyusun kalimat yang benar!</p>
      <a class="link" href="jenjang.html">← Kembali ke Pilihan Kelas</a>
    </footer>
  </div>

  <script src="js/game-kelas1.js"></script>
</body>
</html>
